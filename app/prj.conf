CONFIG_LOG=y

# Buttons and sticks arrive as input events.
CONFIG_INPUT=y

# The USB serial number comes from the unique ID of the chip.
CONFIG_HWINFO=y

# Restarting the chip, for the combinations that restart it.
CONFIG_REBOOT=y

# Events between the parts of the firmware, such as the USB state for the status LED.
CONFIG_ZBUS=y

# Settings kept in flash (see src/storage). The factory reset erases the same partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# Every stored value has a CRC. Changing this later makes the values stored before unreadable.
CONFIG_NVS_DATA_CRC=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
