# More logging on the UART: every input event of the buttons and sticks, and what is read from and
# written to the stored settings. Keep it out of releases. Use it with:
#   west build -b mecha_comet_gamepad mecha-comet-gamepad-fw/app -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_NVS_LOG_LEVEL_DBG=y
