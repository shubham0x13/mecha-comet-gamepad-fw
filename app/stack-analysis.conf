# Prints the stack use of every thread and of the interrupt stack on the UART every 5 seconds, to
# size the stacks. Keep it out of releases. The Cortex-M0+ has no MPU, so a stack that is too small
# corrupts memory without a fault: the sentinel catches that during the tests. Use it with:
#   west build -b mecha_comet_gamepad mecha-comet-gamepad-fw/app -- \
#     -DEXTRA_CONF_FILE=stack-analysis.conf
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y
